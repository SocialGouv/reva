version: "3"

services:
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./docker/default-nginx-site.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 3320:80
    links:
      - clamav_rest:clamav_rest
  clamav_rest:
    build: .
    volumes:
      - ./:/srv/clamav-rest
    links:
      - clamd:clamd
    environment:
      - APP_CONFIG=config.TestConfig
      - APPLICATION_USERS=app1::$$pbkdf2-sha256$$29000$$jZFyrhWitNba25sT4lxLCQ$$08DGXv6463LKrBEZf6wJo6677Jj.qVyWxjdCIO5UcKg
  clamd:
    image: clamav/clamav:unstable-debian13-slim
    ports:
      - 3310:3310
