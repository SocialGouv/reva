name: reva-interop

on:
  push:
    paths:
      - "packages/reva-interop/**"
      - "packages/reva-api/modules/**/*.graphql"
      - ".github/workflows/reva-interop.yml"
      - "!**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app_changed:
              - 'packages/reva-interop/**'
              - 'packages/reva-api/modules/**/*.graphql'
              - '.github/workflows/reva-interop.yml'

  lint:
    needs: [changes]
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/reva-interop
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - name: Interop node_modules cache
        id: interop-node_modules-cache
        uses: actions/cache@v4
        with:
          path: ./packages/reva-interop/node_modules
          key: interop-node_modules-${{ hashFiles('**/package-lock.json') }}
      - name: Installing dependencies
        if: steps.interop-node_modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      # Need to run the postinstall script manually if the node_modules cache is hit because in that case we don't run the npm ci command
      - name: Run postinstall script
        if: steps.interop-node_modules-cache.outputs.cache-hit == 'true'
        run: npm run postinstall
      - name: Running ESLint
        run: npm run lint
