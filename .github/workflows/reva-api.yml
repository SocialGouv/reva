name: reva-api

on:
  push:
    paths:
      - "packages/reva-api/**"
      - ".github/workflows/reva-api.yml"
      - "!**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  BASE_URL: "https://vae.gouv.fr"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app_changed:
              - 'packages/reva-api/**'
              - '.github/workflows/reva-api.yml'

  lint:
    needs: [changes]
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/reva-api
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - name: Api node_modules cache
        id: api-node_modules-cache
        uses: actions/cache@v4
        with:
          path: ./packages/reva-api/node_modules
          key: api-node_modules-${{ hashFiles('**/package-lock.json') }}
      - name: Installing dependencies
        if: steps.api-node_modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Running ESLint
        run: npm run lint

  build:
    needs: [changes]
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/reva-api
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - name: Api node_modules cache
        id: api-node_modules-cache
        uses: actions/cache@v4
        with:
          path: ./packages/reva-api/node_modules
          key: api-node_modules-${{ hashFiles('**/package-lock.json') }}
      - name: Installing dependencies
        if: steps.api-node_modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Building
        run: npm run build --if-present

  integration-tests:
    needs: [changes]
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/reva-api
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
      - name: Api node_modules cache
        id: api-node_modules-cache
        uses: actions/cache@v4
        with:
          path: ./packages/reva-api/node_modules
          key: api-node_modules-${{ hashFiles('**/package-lock.json') }}
      - name: Installing dependencies
        if: steps.api-node_modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Setup Postgres database
        uses: Daniel-Marynicz/postgresql-action@master
        with:
          postgres_image_tag: 13-alpine
          app_user: reva
          app_user_password: password
          app_db: reva-test
          exposed_postgres_port: 5444
          postgres_extensions: uuid-ossp unaccent pg_trgm plpgsql cube earthdistance
      - name: Launch tests
        run: npm run test
